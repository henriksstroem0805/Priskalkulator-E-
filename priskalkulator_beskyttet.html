<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priskalkulator – Eika Økonomi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Times New Roman',Times,serif;background:#f5f8ed;min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock-screen{text-align:center;padding:2rem}
.lock-icon{width:80px;height:80px;margin:0 auto 1.5rem;background:linear-gradient(135deg,#4a7000,#90D000);border-radius:20px;display:flex;align-items:center;justify-content:center}
.lock-icon svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.4rem;color:#2a3318;margin-bottom:.3rem}
.subtitle{color:#6b7a56;font-size:.88rem;margin-bottom:2rem}
.input-group{position:relative;max-width:320px;margin:0 auto 1rem}
.input-group input{width:100%;padding:.85rem 1.1rem;border:2px solid #d4e2be;border-radius:12px;font-size:1rem;font-family:inherit;outline:none;background:#fff;color:#2a3318;transition:border-color .2s,box-shadow .2s}
.input-group input:focus{border-color:#90D000;box-shadow:0 0 0 4px rgba(144,208,0,.12)}
.input-group input::placeholder{color:#9aaa78}
button.unlock{max-width:320px;width:100%;padding:.85rem;border:none;border-radius:12px;background:linear-gradient(135deg,#4a7000,#90D000);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .1s,box-shadow .2s}
button.unlock:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(74,112,0,.25)}
button.unlock:active{transform:translateY(0)}
.error{color:#c44;font-size:.85rem;margin-top:.75rem;min-height:1.2rem}
.footer{color:#9aaa78;font-size:.75rem;margin-top:2rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s ease}
</style>
</head>
<body>
<div class="lock-screen">
<div class="lock-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg></div>
<h1>Priskalkulator</h1>
<p class="subtitle">Eika Økonomi – intern bruk</p>
<div class="input-group"><input type="password" id="pw" placeholder="Skriv inn passord..." autofocus autocomplete="off"></div>
<button class="unlock" onclick="tryUnlock()">Lås opp</button>
<div class="error" id="err"></div>
<div class="footer">Passordbeskyttet dokument</div>
</div>

  if(!pw)return;

    const enc=new TextEncoder();
    const keyData=await crypto.subtle.digest("SHA-256",enc.encode(pw));

    const decrypted=new Uint8Array(encrypted.length);
    for(let i=0;i<encrypted.length;i++)decrypted[i]=encrypted[i]^key[i%key.length];

    const html=dec.decode(decrypted);
