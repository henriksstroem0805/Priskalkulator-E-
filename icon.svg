<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f8f9fc"/>
    <stop offset="100%" stop-color="#e8ecf2"/>
  </linearGradient>
  <linearGradient id="calcBody" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2a2a4a"/>
    <stop offset="50%" stop-color="#1a1a35"/>
    <stop offset="100%" stop-color="#0d0d20"/>
  </linearGradient>
  <linearGradient id="display" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a0a1a"/>
    <stop offset="100%" stop-color="#000005"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowStrong">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
  </filter>
</defs>

<!-- Nøytral lys bakgrunn -->
<rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#bg)"/>

<!-- Kalkulator-kropp med skygge -->
<g filter="url(#shadow)">
<rect x="96" y="72" width="320" height="380" rx="32" ry="32" fill="url(#calcBody)" stroke="#00ffff" stroke-width="3" filter="url(#glow)"/>

<!-- Skjerm -->
<rect x="128" y="104" width="256" height="80" rx="12" ry="12" fill="url(#display)" stroke="#00ffff" stroke-width="2"/>
<!-- Neon tall på skjerm -->
<text x="360" y="160" text-anchor="end" font-family="monospace" font-size="44" font-weight="bold" fill="#00ff00" filter="url(#glow)">1234</text>

<!-- Knapp-rad 1: Rosa -->
<rect x="128" y="210" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="210" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="210" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="210" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 2: Gul -->
<rect x="128" y="274" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="274" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="274" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="274" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 3: Grønn -->
<rect x="128" y="338" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="338" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="338" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="338" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 4: Cyan, stor = -->
<rect x="128" y="402" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="402" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="402" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="402" width="52" height="48" rx="10" ry="10" fill="#ff00ff" stroke="#ff66ff" stroke-width="1" filter="url(#glowStrong)"/>
</g>

</svg>
