<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <radialGradient id="space" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#1a1a3e"/>
    <stop offset="50%" stop-color="#0d0d2b"/>
    <stop offset="100%" stop-color="#000014"/>
  </radialGradient>
  <linearGradient id="calcBody" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2a2a4a"/>
    <stop offset="50%" stop-color="#1a1a35"/>
    <stop offset="100%" stop-color="#0d0d20"/>
  </linearGradient>
  <linearGradient id="display" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a0a1a"/>
    <stop offset="100%" stop-color="#000005"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowStrong">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Space bakgrunn med avrundede hjørner -->
<rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#space)"/>

<!-- Stjerner -->
<circle cx="60" cy="80" r="2" fill="#fff" opacity="0.8"/>
<circle cx="120" cy="50" r="1.5" fill="#fff" opacity="0.6"/>
<circle cx="420" cy="100" r="2" fill="#fff" opacity="0.9"/>
<circle cx="470" cy="160" r="1.5" fill="#fff" opacity="0.7"/>
<circle cx="380" cy="40" r="1" fill="#fff" opacity="0.5"/>
<circle cx="40" cy="440" r="1.5" fill="#fff" opacity="0.6"/>
<circle cx="460" cy="450" r="2" fill="#fff" opacity="0.8"/>
<circle cx="90" cy="480" r="1" fill="#fff" opacity="0.5"/>
<circle cx="200" cy="30" r="1" fill="#fff" opacity="0.4"/>
<circle cx="310" cy="20" r="1.5" fill="#fff" opacity="0.7"/>

<!-- Liten planet oppe til venstre -->
<circle cx="70" cy="140" r="22" fill="#ff00ff" opacity="0.3" filter="url(#glowStrong)"/>
<circle cx="70" cy="140" r="15" fill="#ff4de6"/>
<ellipse cx="70" cy="140" rx="22" ry="4" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.8"/>

<!-- Kalkulator-kropp -->
<rect x="96" y="112" width="320" height="380" rx="32" ry="32" fill="url(#calcBody)" stroke="#00ffff" stroke-width="3" filter="url(#glow)"/>

<!-- Skjerm -->
<rect x="128" y="144" width="256" height="80" rx="12" ry="12" fill="url(#display)" stroke="#00ffff" stroke-width="2"/>
<!-- Neon tall på skjerm -->
<text x="360" y="200" text-anchor="end" font-family="monospace" font-size="44" font-weight="bold" fill="#00ff00" filter="url(#glow)">1234</text>

<!-- Knapp-rad 1: Rosa -->
<rect x="128" y="250" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="250" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="250" width="52" height="48" rx="10" ry="10" fill="#ff1493" stroke="#ff69b4" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="250" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 2: Gul -->
<rect x="128" y="314" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="314" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="314" width="52" height="48" rx="10" ry="10" fill="#ffff00" stroke="#ffff66" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="314" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 3: Grønn -->
<rect x="128" y="378" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="378" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="378" width="52" height="48" rx="10" ry="10" fill="#00ff41" stroke="#66ff80" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="378" width="52" height="48" rx="10" ry="10" fill="#ff8c00" stroke="#ffa500" stroke-width="1" filter="url(#glow)"/>

<!-- Knapp-rad 4: Cyan, stor = -->
<rect x="128" y="442" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="196" y="442" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="264" y="442" width="52" height="48" rx="10" ry="10" fill="#00ffff" stroke="#66ffff" stroke-width="1" filter="url(#glow)"/>
<rect x="332" y="442" width="52" height="48" rx="10" ry="10" fill="#ff00ff" stroke="#ff66ff" stroke-width="1" filter="url(#glowStrong)"/>

</svg>
